name: Linux release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build and repair dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev par2 file
      - name: Validate
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          ARCH: x86_64
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps dist
          install -m755 target/release/starburst AppDir/usr/bin/starburst
          install -m644 assets/io.github.soltros.Starburst.desktop AppDir/usr/share/applications/
          install -m644 assets/io.github.soltros.Starburst.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          curl --fail --location --retry 3 https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage
          ./linuxdeploy.AppImage --appdir AppDir --executable /usr/bin/par2 --output appimage
          mv Starburst*.AppImage dist/Starburst-linux-x86_64.AppImage
          cp target/release/starburst dist/starburst-linux-x86_64
          cp LICENSE dist/LICENSE
          cd dist
          sha256sum Starburst-linux-x86_64.AppImage starburst-linux-x86_64 > SHA256SUMS
      - name: Preserve workflow downloads
        uses: actions/upload-artifact@v4
        with:
          name: Starburst-linux-x86_64
          path: dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            title="Starburst $tag"
          else
            tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            title="Starburst development build ${GITHUB_RUN_NUMBER}"
          fi
          cat > release-notes.md <<'NOTES'
          Download **Starburst-linux-x86_64.AppImage**, mark it executable, and run it. No Rust toolchain or local build is needed. PAR2 repair is included.

          On NixOS: `appimage-run Starburst-linux-x86_64.AppImage`.

          The raw binary is also provided for systems with compatible desktop libraries (glibc 2.35 or newer). This initial build still needs live-provider download testing.
          NOTES
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md --latest
